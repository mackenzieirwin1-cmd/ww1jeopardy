<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WWI Jeopardy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one classroom board. Setup screen, 5x5 clue grid, team score strip, full-screen clue card. */
:root{
  --bg:#ebe5d2; --panel:#f6f2e5; --ink:#22261c; --muted:#5d634f;
  --tile:#3c4a2f; --tile-ink:#f3ecd2; --tile-used:#d4cdb4; --tile-used-ink:#8a8f78;
  --head:#22261c; --head-ink:#f3ecd2;
  --accent:#a8281d; --accent-ink:#fff6ee; --line:#c9c2a8;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15180f; --panel:#1f2417; --ink:#eee8d2; --muted:#a9ae96;
    --tile:#46583a; --tile-ink:#f6efd6; --tile-used:#23281b; --tile-used-ink:#4f553f;
    --head:#0d0f09; --head-ink:#e8dfb8;
    --accent:#d4493b; --accent-ink:#fff6ee; --line:#3a4130; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15180f; --panel:#1f2417; --ink:#eee8d2; --muted:#a9ae96;
  --tile:#46583a; --tile-ink:#f6efd6; --tile-used:#23281b; --tile-used-ink:#4f553f;
  --head:#0d0f09; --head-ink:#e8dfb8;
  --accent:#d4493b; --accent-ink:#fff6ee; --line:#3a4130; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{font-size:clamp(1.6rem,4vw,2.4rem);text-transform:uppercase}
.turn{font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:600;display:flex;align-items:center;gap:10px;min-width:0}
.btn{border:2px solid var(--ink);background:transparent;padding:8px 14px;border-radius:4px;font-weight:600}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}

/* setup */
.setup{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:20px;max-width:760px;margin:0 auto;width:100%}
.setup h2{font-size:clamp(1.6rem,4vw,2.2rem);text-transform:uppercase}
.setup p{margin:0;color:var(--muted)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.counts button{width:48px;height:48px;border:2px solid var(--ink);background:transparent;border-radius:4px;font-family:var(--display);font-size:1.5rem;font-weight:700}
.counts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.names label{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:6px 10px}
.names input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:600;padding:4px 0}
.names input:focus-visible{outline:2px solid var(--accent)}
.rules{margin:0;padding-left:1.2em;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,.8vw,10px)}
.cat{background:var(--head);color:var(--head-ink);font-family:var(--display);font-weight:700;text-transform:uppercase;text-align:center;
  font-size:clamp(.8rem,1.9vw,1.5rem);line-height:1.1;display:flex;align-items:center;justify-content:center;padding:8px 6px;min-height:clamp(50px,min(9vw,9vh),96px);border-radius:3px;letter-spacing:.03em;overflow-wrap:anywhere}
.tile{background:var(--tile);color:var(--tile-ink);border:0;border-radius:3px;font-family:var(--display);font-weight:700;
  font-size:clamp(1.3rem,min(4.6vw,6vh),3.4rem);min-height:clamp(48px,min(9.5vw,10.5vh),110px);letter-spacing:.02em;transition:transform .08s}
.tile:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12)}
.tile:disabled{background:var(--tile-used);color:var(--tile-used-ink);cursor:default}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.team .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.team .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .pts{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.team .adj{display:flex;gap:6px}
.team .adj button{flex:1;border:1px solid var(--line);background:transparent;border-radius:3px;padding:2px 0;color:var(--muted);font-weight:600}
.team .adj button:hover{border-color:var(--ink);color:var(--ink)}

/* clue card */
.overlay{position:fixed;inset:0;z-index:20;background:var(--head);color:var(--head-ink);display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:16px;overflow-y:auto}
.overlay .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.7rem);text-transform:uppercase;letter-spacing:.05em}
.overlay .top .cp{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.overlay .top b{font-size:1.4em;color:var(--head-ink)}
.clue{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:1000px;width:100%;margin:0 auto;min-height:0}
.clue .q{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,4.6vw,3.4rem);line-height:1.15;text-wrap:balance;margin:0;text-align:center}
.clue .a{background:rgba(255,255,255,.08);border-left:6px solid var(--accent);padding:14px 18px;font-size:clamp(1.15rem,2.6vw,1.9rem);font-weight:600;margin:0;min-height:3.2em;display:flex;align-items:center}
.clue .a.hidden{color:var(--tile-used-ink);font-weight:500;font-style:italic}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.overlay .btn{border-color:var(--head-ink);color:var(--head-ink)}
.overlay .btn:hover{background:var(--head-ink);color:var(--head)}
.overlay .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.4rem);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:#ff8a7a}
.award{border-top:1px solid rgba(255,255,255,.2);padding-top:14px;display:flex;flex-direction:column;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.award .lab{font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tile-used-ink);text-align:center;font-weight:600}
.award .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.award .row .btn{display:flex;align-items:center;gap:8px}
.final{max-width:560px;margin:auto;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.final h2{font-size:clamp(2rem,6vw,3.4rem);text-transform:uppercase}
.final ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.final li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:10px 14px;border-radius:4px;font-size:1.2rem;font-weight:600;text-align:left}
.final li .sc{margin-left:auto;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const CATS=[
 {n:"The Spark and the Causes",c:[
  ["The “M” in M.A.I.N. stands for this word, which means a massive build-up of military equipment to gain power.","Militarism"],
  ["Archduke Franz Ferdinand was the heir to the throne of this empire when he was assassinated in Sarajevo in 1914.","Austria-Hungary"],
  ["Name the three countries that made up the Triple Entente.","Britain, France and Russia"],
  ["Germany’s plan to beat France quickly by marching through Belgium, then turn and fight Russia, was named after the general who designed it.","The Schlieffen Plan"],
  ["Explain, in at least three steps, how a conflict between Austria-Hungary and Serbia grew into a world war.","Any three, in order: Austria-Hungary declared war on Serbia. Russia mobilized to support Serbia. Germany declared war on Russia and France. Germany invaded Belgium. Britain declared war on Germany. Alliances pulled each country in."]]},
 {n:"Canada and the Home Front",c:[
  ["Canada was automatically at war in August 1914 because this country, which Canada belonged to as part of its empire, declared war first.","Britain"],
  ["This 1914 law gave the Canadian government huge powers, including censoring mail and holding people without charges.","The War Measures Act"],
  ["Name two ways the Canadian government paid for the war.","Any two: selling Victory Bonds, introducing a (temporary) income tax, taking out loans or borrowing from other countries such as the USA"],
  ["This 1917 policy forced men to join the army and split the country, especially English Canadians and French Canadians.","Conscription (the Military Service Act)"],
  ["Give two ways the war changed life for women in Canada.","Any two: served as nurses overseas; took factory and other jobs left by men; volunteered (for example with the Red Cross); won the right to vote (Manitoba first in 1916, federally in 1918)"]]},
 {n:"Trenches and Technology",c:[
  ["The dangerous strip of land between two enemy trench lines was called this.","No Man’s Land"],
  ["Soldiers who suffered mental trauma from constant bombardment were said to have this condition.","Shell shock"],
  ["Name two new technologies that made WWI deadlier than earlier wars.","Any two: machine guns, poison gas, tanks, airplanes, submarines (U-boats), heavy artillery"],
  ["Generals fought a “war of attrition.” What does that mean, and what was the result?","They tried to wear down and exhaust the enemy, but it meant sending millions of soldiers to their deaths"],
  ["Explain why the war on the Western Front became a stalemate.","Defence was stronger than attack. Machine guns, barbed wire and artillery made charges across No Man’s Land deadly, and both sides dug trenches. Neither could break through."]]},
 {n:"Battles and Heroes",c:[
  ["Canadians captured this hill in northern France on Easter Monday in 1917, and many see it as a symbol of national pride.","Vimy Ridge"],
  ["At the Second Battle of Ypres, Germany used this weapon for the first time on the Western Front.","Poison gas (chlorine gas)"],
  ["He was the first Canadian to command Canadian troops, and he led them at Passchendaele.","Arthur Currie"],
  ["This 1916 battle cost over a million casualties, and the Allies gained only about 10 kilometres.","The Battle of the Somme"],
  ["Name Canada’s top flying ace and the famous German ace nicknamed the “Red Baron.”","Billy Bishop (Canada) and Manfred von Richthofen (Germany)"]]},
 {n:"Ending the War and the Peace",c:[
  ["The armistice that stopped the fighting took effect at this time and date.","11:00 a.m. on November 11, 1918"],
  ["This country joined the Allies in 1917 after German U-boats sank its ships.","The United States"],
  ["This 1919 treaty made Germany admit guilt, pay reparations, give up land and shrink its army.","The Treaty of Versailles"],
  ["This new organization was built on the idea of collective security, but it had no army of its own and the United States never joined.","The League of Nations"],
  ["Explain how the Treaty of Versailles helped lead to another war.","It humiliated and blamed Germany and left it with huge reparations and economic problems. The resulting anger helped the Nazis rise to power."]]}
];
const VALUES=[100,200,300,400,500];
const COLORS=["#c2410c","#1d6fa5","#2f8f4e","#8e44ad","#b8860b","#c0305e","#0f8b8d","#6d4c41"];
const TIME=20;

let S=null; // game state
let timer=null;
const app=document.getElementById('app');
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?'':v)}for(const c of k.flat())e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c));return e};
const chip=i=>{const c=el('span',{class:'chip','aria-hidden':'true'});c.style.background=COLORS[i%8];return c};

let setup={count:3,names:Array.from({length:8},(_,i)=>"Team "+(i+1))};

function renderSetup(){
  stopTimer();
  app.replaceChildren();
  const names=el('div',{class:'names'});
  for(let i=0;i<setup.count;i++){
    const inp=el('input',{id:'tn'+i,type:'text',value:setup.names[i],maxlength:'24','aria-label':'Name for team '+(i+1)});
    inp.addEventListener('input',()=>{setup.names[i]=inp.value});
    names.append(el('label',{for:'tn'+i},chip(i),inp));
  }
  const counts=el('div',{class:'counts',role:'group','aria-label':'Number of teams'});
  for(let n=2;n<=8;n++){
    counts.append(el('button',{type:'button','aria-pressed':String(n===setup.count),onclick:()=>{setup.count=n;renderSetup()}},String(n)));
  }
  app.append(el('div',{class:'bar'},el('h1',{},'WWI Jeopardy')),
    el('section',{class:'setup'},
      el('h2',{},'Set up your teams'),
      el('p',{},'How many teams are playing?'),counts,
      el('p',{},'Rename the teams if you like.'),names,
      el('ul',{class:'rules'},
        el('li',{},'Teams take turns picking a clue.'),
        el('li',{},'The picking team answers first. If they miss, another team can steal.'),
        el('li',{},'A wrong answer loses nothing. Teacher awards points on the clue card.')),
      el('div',{},el('button',{class:'btn primary',type:'button',onclick:startGame},'Start game'))));
}

function startGame(){
  const n=setup.count;
  S={n,teams:Array.from({length:n},(_,i)=>({name:(setup.names[i]||'Team '+(i+1)).trim()||'Team '+(i+1),score:0})),
     used:CATS.map(()=>VALUES.map(()=>false)),turn:0,open:null,done:false};
  renderBoard();
}

function usedCount(){return S.used.flat().filter(Boolean).length}

function renderBoard(){
  stopTimer();
  app.replaceChildren();
  const t=S.teams[S.turn];
  const bar=el('div',{class:'bar'},el('h1',{},'WWI Jeopardy'),
    el('div',{class:'turn'},chip(S.turn),t.name+', pick a clue'),
    el('button',{class:'btn',type:'button',onclick:()=>{ if(newConfirm){newConfirm=false;renderSetup()} else {newConfirm=true;renderBoard()} }},newConfirm?'Tap again to end game':'New game'));
  const board=el('div',{class:'board',role:'grid','aria-label':'Clue board'});
  CATS.forEach(c=>board.append(el('div',{class:'cat',role:'columnheader'},c.n)));
  VALUES.forEach((v,r)=>CATS.forEach((c,ci)=>{
    const used=S.used[ci][r];
    board.append(el('button',{class:'tile',type:'button',disabled:used,'aria-label':c.n+' for '+v+(used?' (used)':''),onclick:()=>openClue(ci,r)},used?'':String(v)));
  }));
  const scores=el('div',{class:'scores'});
  S.teams.forEach((tm,i)=>{
    scores.append(el('div',{class:'team'+(i===S.turn?' active':'')},
      el('div',{class:'nm'},chip(i),el('span',{},tm.name)),
      el('div',{class:'pts','aria-live':'polite'},String(tm.score)),
      el('div',{class:'adj'},
        el('button',{type:'button','aria-label':'Subtract 100 from '+tm.name,onclick:()=>{tm.score-=100;renderBoard()}},'−100'),
        el('button',{type:'button','aria-label':'Add 100 to '+tm.name,onclick:()=>{tm.score+=100;renderBoard()}},'+100'))));
  });
  app.append(bar,board,scores);
  newConfirm=false;
}
let newConfirm=false;

function openClue(ci,r){
  S.open={ci,r,revealed:false,left:TIME,running:false};
  renderClue();
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

function renderClue(){
  stopTimer();
  const o=S.open,c=CATS[o.ci],v=VALUES[o.r],[q,a]=c.c[o.r];
  const ov=el('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':'Clue'});
  const tm=el('div',{class:'timer'+(o.left<=5?' low':''),id:'tm','aria-label':'Seconds left'},String(o.left));
  const startBtn=el('button',{class:'btn',type:'button',onclick:toggleTimer},o.running?'Pause':(o.left===TIME?'Start timer':'Resume'));
  startBtn.id='tbtn';
  ov.append(
    el('div',{class:'top'},el('div',{class:'cp'},c.n,el('b',{},String(v))),
      el('div',{class:'ctrl'},tm,startBtn,el('button',{class:'btn',type:'button',onclick:()=>{S.open=null;ov.remove();renderBoard()}},'Back to board'))),
    el('div',{class:'clue'},
      el('p',{class:'q'},q),
      el('p',{class:'a'+(o.revealed?'':' hidden'),id:'ans'},o.revealed?a:'Answer hidden'),
      el('div',{class:'ctrl'},!o.revealed?el('button',{class:'btn primary',type:'button',onclick:()=>{o.revealed=true;const keep=o.running;renderClue();if(keep){o.running=false;toggleTimer()}}},'Show answer'):'')));
  const row=el('div',{class:'row'});
  const order=S.teams.map((_,i)=>i).sort((x,y)=>((x-S.turn+S.n)%S.n)-((y-S.turn+S.n)%S.n));
  order.forEach(i=>row.append(el('button',{class:'btn',type:'button',onclick:()=>resolve(i)},chip(i),S.teams[i].name+' +'+v)));
  row.append(el('button',{class:'btn',type:'button',onclick:()=>resolve(-1)},'No one'));
  ov.append(el('div',{class:'award'},el('div',{class:'lab'},'Award points to'),row));
  document.querySelector('.overlay')?.remove();
  document.body.append(ov);
}

function toggleTimer(){
  const o=S.open; if(!o)return;
  if(o.running){o.running=false;stopTimer();updTimer();return}
  if(o.left<=0)o.left=TIME;
  o.running=true;
  timer=setInterval(()=>{o.left--;if(o.left<=0){o.left=0;o.running=false;stopTimer()}updTimer()},1000);
  updTimer();
}
function updTimer(){
  const o=S.open;if(!o)return;
  const t=document.getElementById('tm'),b=document.getElementById('tbtn');
  if(t){t.textContent=String(o.left);t.className='timer'+(o.left<=5?' low':'')}
  if(b)b.textContent=o.running?'Pause':(o.left===0?'Restart':(o.left===TIME?'Start timer':'Resume'));
}

function resolve(i){
  const o=S.open; if(!o)return;
  if(i>=0)S.teams[i].score+=VALUES[o.r];
  S.used[o.ci][o.r]=true;
  S.open=null;
  S.turn=(S.turn+1)%S.n;
  stopTimer();
  document.querySelector('.overlay')?.remove();
  if(usedCount()===25){S.done=true;showFinal()}else renderBoard();
}

function showFinal(){
  renderBoard();
  const ranked=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top=ranked[0].score;
  const winners=ranked.filter(t=>t.score===top);
  const ov=el('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':'Final scores'});
  const list=el('ol');
  ranked.forEach(t=>list.append(el('li',{},chip(t.i),t.name,el('span',{class:'sc'},String(t.score)))));
  ov.append(el('div',{class:'final'},
    el('h2',{},winners.length>1?'It’s a tie!':winners[0].name+' wins!'),
    list,
    el('div',{class:'ctrl'},
      el('button',{class:'btn',type:'button',onclick:()=>ov.remove()},'View board'),
      el('button',{class:'btn primary',type:'button',onclick:()=>{ov.remove();renderSetup()}},'Play again'))));
  document.body.append(ov);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S&&S.open){S.open=null;document.querySelector('.overlay')?.remove();renderBoard()}
});

renderSetup();
</script>

</body></html>
